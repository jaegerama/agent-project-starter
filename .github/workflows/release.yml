name: release

# Publishes the GitHub Release for a pushed version tag, notes from its CHANGELOG.md
# section: watchers hear of releases, not tags. bootstrap removes this file from projects.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Notes from the changelog
        run: |
          node -e "
          const fs = require('fs')
          const version = process.env.GITHUB_REF_NAME.slice(1)
          const section = fs.readFileSync('CHANGELOG.md', 'utf8').split(/^## /m).find((s) => s.startsWith('[' + version + ']'))
          if (!section) throw new Error('CHANGELOG.md has no section for ' + version)
          fs.writeFileSync('notes.md', section.slice(section.indexOf('\n') + 1).trim() + '\n')
          "
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
